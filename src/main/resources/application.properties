
# ==================================================
# CONFIGURACION DE LA APLICACION
# ==================================================
spring.application.name=cita-medica
server.port=8080

# ==================================================
# CONEXION CON MYSQL - PUERTO 3307
# ==================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/CITA_MEDICA?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# CONFIGURACION JPA / HIBERNATE
# ==================================================
spring.jpa.hibernate.ddl-auto=validate

# Conservar los nombres definidos en @Table y @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Mostrar sentencias SQL
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Evitar sesiones abiertas en vistas
spring.jpa.open-in-view=false

# Desactivar cache de Thymeleaf
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}


# SQL visible para Laboratorio 02
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=WARN
