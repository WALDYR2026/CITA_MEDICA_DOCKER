<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulario de detalles de cita</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/}">Cita Médica · JPA</a></div></nav>
<div class="border-bottom bg-white"><div class="container-fluid d-flex flex-wrap align-items-center gap-1 py-2"><a class="btn btn-sm btn-primary me-2" th:href="@{/}">Inicio</a><a class="nav-link px-3 py-2" th:href="@{/especialidades}">Especialidades</a><a class="nav-link px-3 py-2" th:href="@{/medicos}">Médicos</a><a class="nav-link px-3 py-2" th:href="@{/servicios}">Servicios</a><a class="nav-link px-3 py-2" th:href="@{/pacientes}">Pacientes</a><a class="nav-link px-3 py-2" th:href="@{/citas}">Citas</a><a class="nav-link px-3 py-2" th:href="@{/detalles}">Detalles de cita</a><a class="nav-link px-3 py-2" th:href="@{/laboratorio-jpa}">Práctica JPA</a></div></div>
<main class="container py-4"><h1 class="h3 mb-3">Formulario de detalles de cita</h1><div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="@{/detalles/guardar}" th:object="${form}" method="post" class="card card-body shadow-sm"><input type="hidden" name="nuevo" th:value="${nuevo}"><div class="mb-3"><label class="form-label">Cita</label><select class="form-select" th:field="*{codigoCit}" th:attr="disabled=${!nuevo}" required><option value="">Seleccione...</option><option th:each="x : ${citas}" th:value="${x.codigoCit}" th:text="${x.codigoCit}"></option></select><div class="text-danger small" th:if="${#fields.hasErrors('codigoCit')}" th:errors="*{codigoCit}"></div></div><div class="mb-3"><label class="form-label">Servicio</label><select class="form-select" id="codigoServ" th:field="*{codigoServ}" th:attr="disabled=${!nuevo}" required><option value="">Seleccione...</option><option th:each="x : ${servicios}" th:value="${x.codigoServ}" th:text="${x.nombreServ}" th:attr="data-especialidad=${x.especialidad.codigoEspecialidad},data-especialidad-nombre=${x.especialidad.nombreEspecialidad}"></option></select><div class="text-danger small" th:if="${#fields.hasErrors('codigoServ')}" th:errors="*{codigoServ}"></div></div><div class="alert alert-light border mb-3" id="especialidadDetalleInfo">La especialidad se determinará a partir del servicio.</div>
<div class="mb-3"><label class="form-label" for="medicoDetalle">Médico para el servicio</label><select id="medicoDetalle" th:field="*{codigoMedico}" class="form-select" required><option value="">Seleccione médico...</option><option th:each="m:${medicos}" th:value="${m.codigoMedico}" th:text="${m.nombreMedico}" th:attr="data-especialidad=${m.especialidad.codigoEspecialidad}"></option></select></div>
<div class="mb-3"><label class="form-label">Cantidad</label><input class="form-control" type="number" th:field="*{cantidad}"  required><div class="text-danger small" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div></div><div class="mb-3"><label class="form-label">Fecha del servicio</label><input class="form-control" type="date" th:field="*{fechaServicio}" required><div class="text-danger small" th:errors="*{fechaServicio}"></div></div><div class="mb-3"><label class="form-label">Hora del servicio</label><input class="form-control" type="time" th:field="*{horaServicio}" required><div class="text-danger small" th:errors="*{horaServicio}"></div></div><input type="hidden" th:if="${!nuevo}" th:field="*{codigoCit}"><input type="hidden" th:if="${!nuevo}" id="codigoServ" th:field="*{codigoServ}"><script th:src="@{/js/detalle-medico.js}" defer></script><div><button class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/detalles}">Cancelar</a></div></form></main></body></html>
