<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de detalles de cita</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/}">Cita Médica · JPA</a></div></nav>
<div class="border-bottom bg-white"><div class="container-fluid d-flex flex-wrap align-items-center gap-1 py-2"><a class="btn btn-sm btn-primary me-2" th:href="@{/}">Inicio</a><a class="nav-link px-3 py-2" th:href="@{/especialidades}">Especialidades</a><a class="nav-link px-3 py-2" th:href="@{/medicos}">Médicos</a><a class="nav-link px-3 py-2" th:href="@{/servicios}">Servicios</a><a class="nav-link px-3 py-2" th:href="@{/pacientes}">Pacientes</a><a class="nav-link px-3 py-2" th:href="@{/citas}">Citas</a><a class="nav-link px-3 py-2" th:href="@{/detalles}">Detalles de cita</a><a class="nav-link px-3 py-2" th:href="@{/laboratorio-jpa}">Práctica JPA</a></div></div>
<main class="container py-4"><h1 class="h3 mb-3">Gestión de detalles de cita</h1><div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><a class="btn btn-primary mb-3" th:href="@{/detalles/nuevo}">Nuevo registro</a><div class="table-responsive"><table class="table table-striped table-hover bg-white"><thead class="table-dark"><tr><th>Cita</th><th>Servicio</th><th>Nombre</th><th>Médico asignado</th><th>Cantidad</th><th>Fecha del servicio</th><th>Hora del servicio</th><th>Acciones</th></tr></thead><tbody><tr th:each="x : ${detalles}"><td th:text="${x.id.codigoCit}"></td><td th:text="${x.id.codigoServ}"></td><td th:text="${x.servicio.nombreServ}"></td><td th:text="${x.medico != null ? x.medico.nombreMedico : 'Pendiente de asignar'}"></td><td th:text="${x.cantidad}"></td><td th:text="${x.fechaServicio}"></td><td th:text="${x.horaServicio}"></td><td><a class="btn btn-sm btn-warning" th:href="@{/detalles/editar/{c}/{s}(c=${x.id.codigoCit},s=${x.id.codigoServ})}">Editar</a> <form class="d-inline" method="post" th:action="@{/detalles/eliminar/{c}/{s}(c=${x.id.codigoCit},s=${x.id.codigoServ})}" onsubmit="return confirm('¿Eliminar registro?')"><button class="btn btn-sm btn-danger">Eliminar</button></form></td></tr></tbody></table></div></main></body></html>
