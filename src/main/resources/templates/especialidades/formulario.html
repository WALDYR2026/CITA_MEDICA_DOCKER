<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formulario especialidad</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/}">Cita Médica</a></div></nav>
<div class="border-bottom bg-white"><div class="container-fluid d-flex flex-wrap align-items-center gap-1 py-2"><a class="btn btn-sm btn-primary me-2" th:href="@{/}">Inicio</a><a class="nav-link px-3 py-2" th:href="@{/especialidades}">Especialidades</a><a class="nav-link px-3 py-2" th:href="@{/medicos}">Médicos</a><a class="nav-link px-3 py-2" th:href="@{/servicios}">Servicios</a><a class="nav-link px-3 py-2" th:href="@{/pacientes}">Pacientes</a><a class="nav-link px-3 py-2" th:href="@{/citas}">Citas</a><a class="nav-link px-3 py-2" th:href="@{/detalles}">Detalles de cita</a><a class="nav-link px-3 py-2" th:href="@{/laboratorio-jpa}">Práctica JPA</a></div></div>
<main class="container py-4"><div class="card mx-auto" style="max-width:620px"><div class="card-body"><h1 class="h4" th:text="${nuevo} ? 'Registrar especialidad' : 'Editar especialidad'"></h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/especialidades/guardar}" th:object="${form}"><input type="hidden" name="nuevo" th:value="${nuevo}"><div class="mb-3"><label class="form-label">Código</label><input class="form-control" th:field="*{codigoEspecialidad}" maxlength="8" th:readonly="${!nuevo}"><div class="text-danger" th:errors="*{codigoEspecialidad}"></div></div><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombreEspecialidad}" maxlength="80"><div class="text-danger" th:errors="*{nombreEspecialidad}"></div></div><button class="btn btn-primary">Guardar</button> <a class="btn btn-secondary" th:href="@{/especialidades}">Cancelar</a></form></div></div></main></body></html>
