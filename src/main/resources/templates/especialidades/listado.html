<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Especialidades</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/}">Cita Médica · JPA</a></div></nav>
<div class="border-bottom bg-white"><div class="container-fluid d-flex flex-wrap align-items-center gap-1 py-2"><a class="btn btn-sm btn-primary me-2" th:href="@{/}">Inicio</a><a class="nav-link px-3 py-2" th:href="@{/especialidades}">Especialidades</a><a class="nav-link px-3 py-2" th:href="@{/medicos}">Médicos</a><a class="nav-link px-3 py-2" th:href="@{/servicios}">Servicios</a><a class="nav-link px-3 py-2" th:href="@{/pacientes}">Pacientes</a><a class="nav-link px-3 py-2" th:href="@{/citas}">Citas</a><a class="nav-link px-3 py-2" th:href="@{/detalles}">Detalles de cita</a><a class="nav-link px-3 py-2" th:href="@{/laboratorio-jpa}">Práctica JPA</a></div></div>
<main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">Especialidades</h1><a th:href="@{/especialidades/nuevo}" class="btn btn-primary">Nueva especialidad</a></div><div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><table class="table table-striped table-bordered"><thead class="table-dark"><tr><th>Código</th><th>Especialidad</th><th>Acciones</th></tr></thead><tbody><tr th:each="e : ${especialidades}"><td th:text="${e.codigoEspecialidad}"></td><td th:text="${e.nombreEspecialidad}"></td><td><a class="btn btn-sm btn-warning" th:href="@{/especialidades/editar/{codigo}(codigo=${e.codigoEspecialidad})}">Editar</a> <form class="d-inline" method="post" th:action="@{/especialidades/eliminar/{codigo}(codigo=${e.codigoEspecialidad})}" onsubmit="return confirm('¿Eliminar especialidad?')"><button class="btn btn-sm btn-danger">Eliminar</button></form></td></tr></tbody></table><a th:href="@{/}" class="btn btn-outline-secondary">Volver al panel</a></main></body></html>
