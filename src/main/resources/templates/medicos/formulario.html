<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <!-- ==========================================
         CONFIGURACIÓN RESPONSIVA
    =========================================== -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Formulario de médicos</title>

    <!-- ==========================================
         BOOTSTRAP CSS
    =========================================== -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <!-- ==========================================
         BARRA DE NAVEGACIÓN
    =========================================== -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand"
               th:href="@{/}">
                Sistema de Citas Médicas
            </a>
        </div>
    </nav>
<div class="border-bottom bg-white"><div class="container-fluid d-flex flex-wrap align-items-center gap-1 py-2"><a class="btn btn-sm btn-primary me-2" th:href="@{/}">Inicio</a><a class="nav-link px-3 py-2" th:href="@{/especialidades}">Especialidades</a><a class="nav-link px-3 py-2" th:href="@{/medicos}">Médicos</a><a class="nav-link px-3 py-2" th:href="@{/servicios}">Servicios</a><a class="nav-link px-3 py-2" th:href="@{/pacientes}">Pacientes</a><a class="nav-link px-3 py-2" th:href="@{/citas}">Citas</a><a class="nav-link px-3 py-2" th:href="@{/detalles}">Detalles de cita</a><a class="nav-link px-3 py-2" th:href="@{/laboratorio-jpa}">Práctica JPA</a></div></div>


    <!-- ==========================================
         CONTENIDO PRINCIPAL
    =========================================== -->
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-7">

                <div class="card shadow-sm">

                    <div class="card-header bg-dark text-white">
                        <h1
                            class="h5 mb-0"
                            th:text="${nuevo}
                                ? 'Registrar médico'
                                : 'Editar médico'">
                            Registrar médico
                        </h1>
                    </div>

                    <div class="card-body">

                        <!-- ==================================
                             FORMULARIO
                        =================================== -->
                        <form
                            th:action="@{/medicos/guardar}"
                            th:object="${medico}"
                            method="post">

                            <!-- Indica si es CREATE o UPDATE -->
                            <input
                                type="hidden"
                                name="nuevo"
                                th:value="${nuevo}">

                            <!-- CÓDIGO -->
                            <div class="mb-3">
                                <label
                                    for="codigoMedico"
                                    class="form-label">
                                    Código
                                </label>

                                <input
                                    type="text"
                                    id="codigoMedico"
                                    th:field="*{codigoMedico}"
                                    class="form-control"
                                    maxlength="6"
                                    placeholder="MED001"
                                    th:readonly="${!nuevo}"
                                    th:classappend="${#fields.hasErrors('codigoMedico')}
                                        ? 'is-invalid' : ''"
                                    autofocus>

                                <div
                                    class="invalid-feedback"
                                    th:errors="*{codigoMedico}">
                                </div>

                                <div class="form-text">
                                    Debe contener exactamente seis caracteres.
                                </div>
                            </div>

                            <!-- NOMBRE -->
                            <div class="mb-3">
                                <label
                                    for="nombreMedico"
                                    class="form-label">
                                    Nombre completo
                                </label>

                                <input
                                    type="text"
                                    id="nombreMedico"
                                    th:field="*{nombreMedico}"
                                    class="form-control"
                                    placeholder="Nombre del médico"
                                    th:classappend="${#fields.hasErrors('nombreMedico')}
                                        ? 'is-invalid' : ''">

                                <div
                                    class="invalid-feedback"
                                    th:errors="*{nombreMedico}">
                                </div>
                            </div>

                            <!-- ESPECIALIDAD -->
                            <div class="mb-3">
                                <label
                                    for="codigoEspecialidad"
                                    class="form-label">
                                    Especialidad
                                </label>

                                <select
                                    id="codigoEspecialidad"
                                    name="codigoEspecialidad"
                                    class="form-select"
                                    th:classappend="${errorEspecialidad != null}
                                        ? 'is-invalid' : ''">

                                    <option value="">
                                        Seleccione una especialidad
                                    </option>

                                    <option
                                        th:each="especialidad : ${especialidades}"
                                        th:value="${especialidad.codigoEspecialidad}"
                                        th:text="${especialidad.nombreEspecialidad}"
                                        th:selected="${codigoEspecialidadSeleccionada != null
                                            ? codigoEspecialidadSeleccionada
                                                == especialidad.codigoEspecialidad
                                            : medico.especialidad != null
                                                and medico.especialidad.codigoEspecialidad
                                                == especialidad.codigoEspecialidad}">
                                    </option>
                                </select>

                                <div
                                    class="invalid-feedback"
                                    th:if="${errorEspecialidad}"
                                    th:text="${errorEspecialidad}">
                                </div>
                            </div>

                            <!-- BOTONES -->
                            <div class="d-flex gap-2 justify-content-end">

                                <a
                                    th:href="@{/medicos}"
                                    class="btn btn-outline-secondary">
                                    Cancelar
                                </a>

                                <button
                                    type="submit"
                                    class="btn btn-primary">
                                    Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ==========================================
         NORMALIZAR CÓDIGO A MAYÚSCULAS
    =========================================== -->
    <script>
        const codigo = document.getElementById("codigoMedico");

        codigo.addEventListener("input", function () {
            this.value = this.value.toUpperCase();
        });
    </script>
</body>
</html>
