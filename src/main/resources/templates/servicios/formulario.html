<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulario de servicios</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/}">Cita Médica · JPA</a></div></nav>
<div class="border-bottom bg-white"><div class="container-fluid d-flex flex-wrap align-items-center gap-1 py-2"><a class="btn btn-sm btn-primary me-2" th:href="@{/}">Inicio</a><a class="nav-link px-3 py-2" th:href="@{/especialidades}">Especialidades</a><a class="nav-link px-3 py-2" th:href="@{/medicos}">Médicos</a><a class="nav-link px-3 py-2" th:href="@{/servicios}">Servicios</a><a class="nav-link px-3 py-2" th:href="@{/pacientes}">Pacientes</a><a class="nav-link px-3 py-2" th:href="@{/citas}">Citas</a><a class="nav-link px-3 py-2" th:href="@{/detalles}">Detalles de cita</a><a class="nav-link px-3 py-2" th:href="@{/laboratorio-jpa}">Práctica JPA</a></div></div>
<main class="container py-4"><h1 class="h3 mb-3">Formulario de servicios</h1><div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="@{/servicios/guardar}" th:object="${form}" method="post" class="card card-body shadow-sm"><input type="hidden" name="nuevo" th:value="${nuevo}"><div class="mb-3"><label class="form-label">Código</label><input class="form-control" type="text" th:field="*{codigoServ}" th:readonly="${!nuevo}"  required><div class="text-danger small" th:if="${#fields.hasErrors('codigoServ')}" th:errors="*{codigoServ}"></div></div><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" type="text" th:field="*{nombreServ}"  required><div class="text-danger small" th:if="${#fields.hasErrors('nombreServ')}" th:errors="*{nombreServ}"></div></div><div class="mb-3"><label class="form-label">Precio</label><input class="form-control" type="number" th:field="*{precioServ}" min="1" step="0.01" required><div class="text-danger small" th:if="${#fields.hasErrors('precioServ')}" th:errors="*{precioServ}"></div></div><div class="mb-3"><label class="form-label">Especialidad</label><select class="form-select" th:field="*{codigoEspecialidad}" required><option value="">Seleccione...</option><option th:each="x : ${especialidades}" th:value="${x.codigoEspecialidad}" th:text="${x.nombreEspecialidad}"></option></select><div class="text-danger small" th:if="${#fields.hasErrors('codigoEspecialidad')}" th:errors="*{codigoEspecialidad}"></div></div><div><button class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/servicios}">Cancelar</a></div></form></main></body></html>
