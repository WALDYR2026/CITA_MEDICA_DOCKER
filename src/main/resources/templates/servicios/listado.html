<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de servicios</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/}">Cita Médica · JPA</a></div></nav>
<div class="border-bottom bg-white"><div class="container-fluid d-flex flex-wrap align-items-center gap-1 py-2"><a class="btn btn-sm btn-primary me-2" th:href="@{/}">Inicio</a><a class="nav-link px-3 py-2" th:href="@{/especialidades}">Especialidades</a><a class="nav-link px-3 py-2" th:href="@{/medicos}">Médicos</a><a class="nav-link px-3 py-2" th:href="@{/servicios}">Servicios</a><a class="nav-link px-3 py-2" th:href="@{/pacientes}">Pacientes</a><a class="nav-link px-3 py-2" th:href="@{/citas}">Citas</a><a class="nav-link px-3 py-2" th:href="@{/detalles}">Detalles de cita</a><a class="nav-link px-3 py-2" th:href="@{/laboratorio-jpa}">Práctica JPA</a></div></div>
<main class="container py-4"><h1 class="h3 mb-3">Gestión de servicios</h1><div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><a class="btn btn-primary mb-3" th:href="@{/servicios/nuevo}">Nuevo registro</a><div class="table-responsive"><table class="table table-striped table-hover bg-white"><thead class="table-dark"><tr><th>Código</th><th>Servicio</th><th>Precio</th><th>Especialidad</th><th>Acciones</th></tr></thead><tbody><tr th:each="x : ${servicios}"><td th:text="${x.codigoServ}"></td><td th:text="${x.nombreServ}"></td><td th:text="${x.precioServ}"></td><td th:text="${x.especialidad.nombreEspecialidad}"></td><td><a class="btn btn-sm btn-warning" th:href="@{/servicios/editar/{id}(id=${x.codigoServ})}">Editar</a> <form class="d-inline" method="post" th:action="@{/servicios/eliminar/{id}(id=${x.codigoServ})}" onsubmit="return confirm('¿Eliminar registro?')"><button class="btn btn-sm btn-danger">Eliminar</button></form></td></tr></tbody></table></div></main></body></html>
